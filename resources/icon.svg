<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main background -->
  <rect width="256" height="256" rx="48" fill="url(#bgGradient)"/>
  
  <!-- People group icon - representing HR management -->
  <!-- Person 1 (left) -->
  <circle cx="70" cy="65" r="18" fill="#ffffff" opacity="0.95"/>
  <path d="M 50 110 Q 50 95 70 95 Q 90 95 90 110 L 90 140 Q 90 150 80 150 L 60 150 Q 50 150 50 140 Z" fill="#ffffff" opacity="0.95"/>
  
  <!-- Person 2 (center) -->
  <circle cx="128" cy="55" r="22" fill="#ffffff"/>
  <path d="M 100 115 Q 100 95 128 95 Q 156 95 156 115 L 156 155 Q 156 168 142 168 L 114 168 Q 100 168 100 155 Z" fill="#ffffff"/>
  
  <!-- Person 3 (right) -->
  <circle cx="186" cy="70" r="18" fill="#ffffff" opacity="0.95"/>
  <path d="M 166 115 Q 166 100 186 100 Q 206 100 206 115 L 206 145 Q 206 155 196 155 L 176 155 Q 166 155 166 145 Z" fill="#ffffff" opacity="0.95"/>
  
  <!-- Document/briefcase element (bottom) -->
  <g transform="translate(128, 190)">
    <!-- Briefcase -->
    <rect x="-35" y="-15" width="70" height="45" rx="4" fill="url(#accentGradient)" stroke="#ffffff" stroke-width="2"/>
    <rect x="-28" y="-18" width="56" height="6" rx="3" fill="url(#accentGradient)" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Handle -->
    <path d="M -15 -18 Q -15 -35 0 -35 Q 15 -35 15 -18" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Lines representing documents/data -->
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#1e40af" stroke-width="2" stroke-linecap="round"/>
    <line x1="-20" y1="10" x2="15" y2="10" stroke="#1e40af" stroke-width="2" stroke-linecap="round"/>
    <line x1="-20" y1="20" x2="10" y2="20" stroke="#1e40af" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
